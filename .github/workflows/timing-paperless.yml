# Scanner scan-step timing — paperless (generated by depproof-corpus/timing/make-workflows.py; do not edit here).
name: Scan timing — paperless
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to measure. Defaults to the corpus pin.
        required: false
        default: 'depproof-pinned'
permissions:
  contents: read
jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Time the image pull (cold, once per job)
        run: |
          mkdir -p timing
          s=$(date +%s.%N); docker pull -q ghcr.io/depproof/depproof:v1 >/dev/null; e=$(date +%s.%N)
          echo "pull,$(echo "$e - $s" | bc)" > timing/pull.csv
          docker image inspect ghcr.io/depproof/depproof:v1 --format '{{.Size}}' > timing/image-bytes.txt
      - name: Time five scans, each a fresh container
        run: |
          echo "rep,seconds,peak_mb,exit" > timing/scans.csv
          for i in 1 2 3 4 5; do
            name=scan$i; peak=0
            s=$(date +%s.%N)
            docker run --name $name -v "$PWD:/w" -w /w ghcr.io/depproof/depproof:v1 scan uv.lock --fail-on none --output-dir /w/out-$i > timing/scan-$i.log 2>&1 &
            pid=$!
            while kill -0 $pid 2>/dev/null; do
              m=$(docker stats --no-stream --format '{{.MemUsage}}' $name 2>/dev/null | awk '{print $1}')
              mb=$(python3 -c "import re,sys; v=sys.argv[1]; n=float(re.sub('[^0-9.]','',v) or 0); u=re.sub('[0-9.]','',v); print(int(n*{'GiB':1024,'MiB':1,'KiB':1/1024}.get(u,0)))" "${m:-0MiB}")
              [ "$mb" -gt "$peak" ] && peak=$mb
              sleep 0.5
            done
            wait $pid; code=$?; e=$(date +%s.%N)
            docker rm $name >/dev/null
            echo "$i,$(echo "$e - $s" | bc),$peak,$code" >> timing/scans.csv
          done
          cat timing/pull.csv timing/scans.csv
          grep -h -E "components:" timing/scan-1.log | head -3 > timing/components.txt || true
          nproc > timing/nproc.txt; grep -m1 'model name' /proc/cpuinfo > timing/cpu.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-paperless
          path: timing/
          retention-days: 30
